version: "2"

run:
  # Lint the end-to-end tests too; they only build with this tag.
  build-tags:
    - e2e

issues:
  max-same-issues: 50

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - gosec
    - govet
    - iface
    - inamedparam
    - intrange
    - makezero
    - mirror
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 30
      package-average: 0.0
    decorder:
      disable-dec-order-check: false
      disable-dec-num-check: true
    depguard:
      rules:
        non-test files:
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead
        logging:
          files:
            - $all
          deny:
            - pkg: log$
              desc: Use encore.dev/rlog, or workflow.GetLogger / activity.GetLogger inside Temporal code
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - mapliteral
    funcorder:
      struct-method: false
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 4
      min-occurrences: 5
      ignore-tests: true
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    gocyclo:
      min-complexity: 20
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    inamedparam:
      skip-single-param: true
    nakedret:
      max-func-lines: 0
    nolintlint:
      allow-no-explanation: [funlen, gocognit]
      require-explanation: true
      require-specific: true
    perfsprint:
      strconcat: true
      error-format: false
    revive:
      confidence: 0.8
      rules:
        - name: bool-literal-in-expr
        - name: confusing-results
        - name: context-as-argument
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: identical-branches
        - name: if-return
        - name: indent-error-flow
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-equal
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: use-any
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
    usetesting:
      os-temp-dir: true
  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # initService is called from Encore's generated main, which the linter never sees.
      - path: internal/api/bill/(service|config)\.go
        linters:
          - unused
